<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bacitra — Pencari Rute Bus Balikpapan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171b26;
    --panel2: #1e2330;
    --border: #2a2f40;
    --accent: #f5a623;
    --accent2: #4fc3f7;
    --red: #ef5350;
    --green: #66bb6a;
    --transit: #ab47bc;
    --text: #e8eaf0;
    --muted: #6b7280;
    --kor1: #f5a623;
    --kor2a: #4fc3f7;
    --kor2b: #66bb6a;
    --transit-c: #ab47bc;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'DM Sans', sans-serif; }

  #app { display:flex; height:100vh; }

  /* ── LEFT PANEL ── */
  #panel {
    width: 360px;
    min-width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
  }

  #header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #header .logo {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  #header .logo span { color: var(--text); }
  #header .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  #search-area {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 13px;
  }

  select {
    width: 100%;
    padding: 10px 34px 10px 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    appearance: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select:focus { outline: none; border-color: var(--accent); }
  select option { background: var(--panel2); }

  .swap-btn {
    align-self: center;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .swap-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(180deg); }

  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > div { flex: 1; }

  #cari-btn {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.1s;
  }
  #cari-btn:hover { opacity: 0.88; }
  #cari-btn:active { transform: scale(0.98); }

  /* ── RESULT ── */
  #result-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--muted);
    text-align: center;
  }
  #empty-state .icon { font-size: 40px; opacity: 0.4; }
  #empty-state p { font-size: 13px; line-height: 1.6; }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .stat-card .val {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat-card .key {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .section-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
    margin-top: 14px;
  }

  .koridor-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
  }
  .badge-1   { background: rgba(245,166,35,0.15);  color: var(--kor1);    border: 1px solid rgba(245,166,35,0.3); }
  .badge-2a  { background: rgba(79,195,247,0.15);  color: var(--kor2a);   border: 1px solid rgba(79,195,247,0.3); }
  .badge-2b  { background: rgba(102,187,106,0.15); color: var(--kor2b);   border: 1px solid rgba(102,187,106,0.3); }
  .badge-tr  { background: rgba(171,71,188,0.15);  color: var(--transit-c); border: 1px solid rgba(171,71,188,0.3); }

  /* Transit info */
  .transit-card {
    background: rgba(171,71,188,0.08);
    border: 1px solid rgba(171,71,188,0.25);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .transit-card .t-halte { font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .transit-card .t-info  { color: var(--muted); }
  .transit-card .t-info span { color: var(--transit-c); font-weight: 600; }

  /* Route list */
  .route-list { display: flex; flex-direction: column; gap: 0; }
  .route-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 5px 0;
    font-size: 12.5px;
    position: relative;
  }
  .route-item:not(:last-child)::before {
    content: '';
    position: absolute;
    left: 6px; top: 18px;
    width: 1px;
    height: calc(100% - 4px);
    background: var(--border);
  }
  .dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 3px;
    border: 2px solid;
    position: relative;
    z-index: 1;
  }
  .dot-start  { background: var(--green);  border-color: var(--green); }
  .dot-end    { background: var(--red);    border-color: var(--red); }
  .dot-transit{ background: var(--transit-c); border-color: var(--transit-c); }
  .dot-mid    { background: var(--panel);  border-color: var(--border); }

  .route-name { flex: 1; padding-top: 0px; line-height: 1.5; }
  .route-name .idx { font-size: 10px; color: var(--muted); margin-right: 4px; }
  .route-koridor {
    font-size: 9px;
    font-family: 'Space Mono', monospace;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 5px;
    vertical-align: middle;
  }

  .error-box {
    background: rgba(239,83,80,0.1);
    border: 1px solid rgba(239,83,80,0.3);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    color: var(--red);
    text-align: center;
  }

  /* ── LEGEND ── */
  #legend {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .leg-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  .leg-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* ── MAP ── */
  #map { flex: 1; background: #0d1117; }

  /* Leaflet overrides */
  .leaflet-popup-content-wrapper {
    background: var(--panel2) !important;
    color: var(--text) !important;
    border: 1px solid var(--border) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
  }
  .leaflet-popup-tip { background: var(--panel2) !important; }
  .leaflet-popup-content { margin: 10px 14px !important; font-family: 'DM Sans', sans-serif; font-size: 12px; }
  .popup-nama { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .popup-id   { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }

  .leaflet-control-zoom a {
    background: var(--panel2) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-zoom a:hover { background: var(--panel) !important; }
  .leaflet-control-attribution { display: none !important; }

  /* scrollbar */
  #result-area::-webkit-scrollbar { width: 4px; }
  #result-area::-webkit-scrollbar-track { background: transparent; }
  #result-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

<div id="app">

  <!-- LEFT PANEL -->
  <div id="panel">

      <div>
        <div class="field-label">Halte Tujuan</div>

          <select id="sel-tujuan"><option value="">— Pilih Halte —</option></select>
        </div>
      </div>
      <button id="cari-btn">🔍 CARI RUTE</button>

    <div id="result-area">
      <div id="empty-state">
        <div class="icon">🚌</div>
        <p>Pilih halte asal dan tujuan<br>lalu klik <strong>Cari Rute</strong></p>

    </div>

    <div id="legend">

      <div class="leg-item"><div class="leg-dot" style="background:var(--transit-c)"></div>Transit</div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>
</div>

const BOBOT = { "1": 4, "2A": 2, "2B": 4 };
const WAKTU_TRANSIT = 10;

const KOR_COLOR = { "1": "#f5a623", "2A": "#4fc3f7", "2B": "#66bb6a", "TRANSIT": "#ab47bc" };

// ═══════════════════════════════════════════
// GRAPH BUILDER
// ═══════════════════════════════════════════
function normNama(n) { return n.toLowerCase().trim(); }

function buildGraph(halteList) {
  const graph = {};
  halteList.forEach(h => graph[h.id] = []);

  // Urutkan per koridor
  const byKor = {};
  halteList.forEach(h => {
    if (!byKor[h.koridor]) byKor[h.koridor] = [];
    byKor[h.koridor].push(h);
  });
  Object.values(byKor).forEach(arr => arr.sort((a,b) => a.urutan - b.urutan));

  // 1. Edge berurutan dalam koridor
  Object.entries(byKor).forEach(([kor, arr]) => {
    const w = BOBOT[kor] || 3;
    for (let i = 0; i < arr.length - 1; i++) {
      const a = arr[i], b = arr[i+1];
      if (a.lat !== null && b.lat !== null) {
        graph[a.id].push({ ke: b.id, waktu: w, koridor: kor });
        graph[b.id].push({ ke: a.id, waktu: w, koridor: kor });
      }
    }
  });

  // 2. Transit (nama sama, koridor beda)
  const namaMap = {};
  halteList.forEach(h => {
    const k = normNama(h.nama);
    if (!namaMap[k]) namaMap[k] = [];
    namaMap[k].push(h);
  });
  Object.values(namaMap).forEach(grp => {
    for (let i = 0; i < grp.length; i++) {
      for (let j = i+1; j < grp.length; j++) {
        const a = grp[i], b = grp[j];
        if (a.koridor !== b.koridor && a.lat !== null && b.lat !== null) {
          graph[a.id].push({ ke: b.id, waktu: WAKTU_TRANSIT, koridor: 'TRANSIT' });
          graph[b.id].push({ ke: a.id, waktu: WAKTU_TRANSIT, koridor: 'TRANSIT' });
        }
      }
    }
  });

  return graph;
}

// ═══════════════════════════════════════════
// DIJKSTRA
// ═══════════════════════════════════════════
function dijkstra(graph, start) {
  const dist = {}, prev = {};
  Object.keys(graph).forEach(id => { dist[id] = Infinity; prev[id] = null; });
  dist[start] = 0;

  // Simple priority queue (array, cukup untuk ~120 node)
  const pq = [[0, start]];

  while (pq.length) {
    pq.sort((a,b) => a[0] - b[0]);
    const [d, u] = pq.shift();
    if (d > dist[u]) continue;
    (graph[u] || []).forEach(({ ke, waktu, koridor }) => {
      const nd = dist[u] + waktu;
      if (nd < dist[ke]) {
        dist[ke] = nd;
        prev[ke] = { dari: u, koridor };
        pq.push([nd, ke]);
      }
    });
  }
  return { dist, prev };
}

function reconstructPath(prev, start, end) {
  const path = [];
  let cur = end;
  while (cur && cur !== start) {
    const info = prev[cur];
    if (!info) break;
    path.push({ id: cur, koridor: info.koridor });
    cur = info.dari;
  }
  path.push({ id: start, koridor: null });
  path.reverse();
  return path;
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
const graph = buildGraph(HALTE_DATA);
const idMap = {};
HALTE_DATA.forEach(h => idMap[h.id] = h);

// Populate dropdowns (sorted by koridor then nama)
const selAsal   = document.getElementById('sel-asal');
const selTujuan = document.getElementById('sel-tujuan');

const sorted = [...HALTE_DATA].sort((a,b) => {
  if (a.koridor !== b.koridor) return a.koridor.localeCompare(b.koridor);
  return a.urutan - b.urutan;
});

sorted.forEach(h => {
  const label = `[${h.koridor}] ${h.nama}${h.status==='not_found'?' ⚠':''}`;
  [selAsal, selTujuan].forEach(sel => {
    const opt = document.createElement('option');
    opt.value = h.id;
    opt.textContent = label;
    sel.appendChild(opt);
  });
});

// Swap button
document.getElementById('swap-btn').onclick = () => {
  const tmp = selAsal.value;
  selAsal.value = selTujuan.value;
  selTujuan.value = tmp;
};

// ═══════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════
const map = L.map('map', { center: [-1.2516, 116.8459], zoom: 13 });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19
}).addTo(map);

// Draw all halte as small dots
const allMarkers = {};
let routeLayers = [];

function makeIcon(color, size=10) {
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid rgba(0,0,0,0.5);box-shadow:0 0 4px ${color}44"></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

HALTE_DATA.forEach(h => {
  if (h.lat === null) return;
  const color = KOR_COLOR[h.koridor] || '#888';
  const marker = L.marker([h.lat, h.lon], { icon: makeIcon(color, 8) })
    .addTo(map)
    .bindPopup(`<div class="popup-nama">${h.nama}</div><div class="popup-id">${h.id} · Koridor ${h.koridor}</div>`);
  allMarkers[h.id] = marker;
});

// ═══════════════════════════════════════════
// CARI RUTE
// ═══════════════════════════════════════════
function clearRouteLayers() {
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];
  // Reset marker sizes
  Object.values(allMarkers).forEach(m => {
    const h = HALTE_DATA.find(x => allMarkers[x.id] === m);
    if (h) m.setIcon(makeIcon(KOR_COLOR[h.koridor] || '#888', 8));
  });
}

document.getElementById('cari-btn').onclick = () => {
  const idAsal   = selAsal.value;
  const idTujuan = selTujuan.value;
  const result   = document.getElementById('result-area');

  if (!idAsal || !idTujuan) {
    result.innerHTML = `<div class="error-box">Pilih halte asal dan tujuan terlebih dahulu.</div>`;
    return;
  }
  if (idAsal === idTujuan) {
    result.innerHTML = `<div class="error-box">Asal dan tujuan tidak boleh sama.</div>`;
    return;
  }

  const hAsal = idMap[idAsal], hTujuan = idMap[idTujuan];

  if (hAsal.status === 'not_found' || hTujuan.status === 'not_found') {
    result.innerHTML = `<div class="error-box">⚠ Salah satu halte belum memiliki koordinat (not_found). Isi koordinat manual di halte.json terlebih dahulu.</div>`;
    return;
  }

  const { dist, prev } = dijkstra(graph, idAsal);

  if (dist[idTujuan] === Infinity) {
    result.innerHTML = `<div class="error-box">❌ Tidak ada jalur yang menghubungkan kedua halte ini.</div>`;
    return;
  }

  const path = reconstructPath(prev, idAsal, idTujuan);
  const totalWaktu = dist[idTujuan];
  const jumlahHalte = path.length;

  // Koridor unik
  const korUnik = [...new Set(path.map(p => p.koridor).filter(k => k && k !== 'TRANSIT'))];

  // Titik transit
  const transitPoints = [];
  for (let i = 1; i < path.length; i++) {
    const prevKor = path[i-1].koridor;
    const currKor = path[i].koridor;
    if (prevKor && currKor && prevKor !== currKor && (prevKor === 'TRANSIT' || currKor === 'TRANSIT')) {
      if (!transitPoints.includes(path[i].id)) transitPoints.push(path[i].id);
    }
  }

  // ── RENDER PANEL ──
  const badgeKor = korUnik.map(k => {
    const cls = k === '1' ? 'badge-1' : k === '2A' ? 'badge-2a' : 'badge-2b';
    return `<span class="badge ${cls}">Koridor ${k}</span>`;
  }).join('');

  const transitHTML = transitPoints.length ? `
    <div class="section-title">🔄 Titik Transit</div>
    ${transitPoints.map(tid => {
      const h = idMap[tid];
      const idx = path.findIndex(p => p.id === tid);
      const fromKor = idx > 0 ? (path[idx-1].koridor||'?') : '?';
      const toKor   = path[idx].koridor || '?';
      return `<div class="transit-card">
        <div class="t-halte">📍 ${h.nama}</div>
        <div class="t-info">Koridor <span>${fromKor.replace('TRANSIT','')}</span> → <span>${toKor.replace('TRANSIT','')}</span></div>
      </div>`;
    }).join('')}` : '';

  const routeHTML = path.map((p, i) => {
    const h = idMap[p.id];
    const isStart   = i === 0;
    const isEnd     = i === path.length - 1;
    const isTransit = transitPoints.includes(p.id) && !isStart && !isEnd;
    const dotClass  = isStart ? 'dot-start' : isEnd ? 'dot-end' : isTransit ? 'dot-transit' : 'dot-mid';
    const korLabel  = p.koridor && p.koridor !== 'TRANSIT' ?
      `<span class="route-koridor badge badge-${p.koridor.toLowerCase().replace('2a','2a').replace('2b','2b').replace('1','1')}">${p.koridor}</span>` : '';
    return `<div class="route-item">
      <div class="dot ${dotClass}"></div>
      <div class="route-name"><span class="idx">${String(i+1).padStart(2,'0')}.</span>${h.nama}${korLabel}</div>
    </div>`;
  }).join('');

  result.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="val">${totalWaktu}'</div><div class="key">Estimasi Waktu</div></div>
      <div class="stat-card"><div class="val">${jumlahHalte}</div><div class="key">Jumlah Halte</div></div>
      <div class="stat-card"><div class="val">${korUnik.length}</div><div class="key">Koridor</div></div>
      <div class="stat-card"><div class="val">${transitPoints.length}</div><div class="key">Kali Transit</div></div>
    </div>
    <div class="koridor-badges">${badgeKor}</div>
    ${transitHTML}
    <div class="section-title">📍 Urutan Halte</div>
    <div class="route-list">${routeHTML}</div>
  `;

  // ── RENDER MAP ──
  clearRouteLayers();

  // Draw route polyline per segment
  for (let i = 0; i < path.length - 1; i++) {
    const a = idMap[path[i].id];
    const b = idMap[path[i+1].id];
    if (!a.lat || !b.lat) continue;
    const color = KOR_COLOR[path[i+1].koridor] || '#fff';
    const line = L.polyline([[a.lat, a.lon],[b.lat, b.lon]], {
      color, weight: 4, opacity: 0.9,
      dashArray: path[i+1].koridor === 'TRANSIT' ? '6,5' : null
    }).addTo(map);
    routeLayers.push(line);
  }

  // Highlight route markers
  path.forEach((p, i) => {
    const m = allMarkers[p.id];
    if (!m) return;
    const isStart = i === 0, isEnd = i === path.length - 1;
    const color = isStart ? '#66bb6a' : isEnd ? '#ef5350' : (KOR_COLOR[p.koridor] || '#fff');
    const size  = isStart || isEnd ? 16 : 12;
    m.setIcon(makeIcon(color, size));
    if (isStart || isEnd) m.openPopup();
  });

  // Fit map to route
  const coords = path.map(p => idMap[p.id]).filter(h => h.lat).map(h => [h.lat, h.lon]);
  if (coords.length > 1) map.fitBounds(coords, { padding: [40, 40] });
};
